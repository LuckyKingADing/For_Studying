<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个待办事项应用</title>
    <style>
        /* 内联样式 - 先简单了解CSS */
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .todo-input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .add-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .add-btn:hover {
            background-color: #45a049;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .todo-item {
            padding: 10px;
            background-color: white;
            margin-bottom: 5px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>待办事项</h1>

    <!-- 输入区域 -->
    <div>
        <input type="text" class="todo-input" id="todoInput" placeholder="输入待办事项...">
        <button class="add-btn" onclick="addTodo()">添加</button>
    </div>

    <!-- 待办事项列表 -->
    <ul class="todo-list" id="todoList">
        <!-- 这里会通过JavaScript动态添加 -->
    </ul>

    <script>
        // JavaScript 代码 - 让页面动起来
        let todos = []; // 存储所有待办事项

        // 添加待办事项
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();

            if (text === '') {
                alert('请输入内容！');
                return;
            }

            // 创建一个待办事项对象
            const todo = {
                id: Date.now(), // 使用时间戳作为唯一ID
                text: text,
                completed: false
            };

            todos.push(todo);
            input.value = ''; // 清空输入框
            renderTodos(); // 重新渲染列表
        }

        // 删除待办事项
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            renderTodos();
        }

        // 切换完成状态
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            renderTodos();
        }

        // 渲染待办事项列表
        function renderTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = ''; // 清空列表

            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    <span style="text-decoration: ${todo.completed ? 'line-through' : 'none'}; cursor: pointer;"
                          onclick="toggleTodo(${todo.id})">
                        ${todo.text}
                    </span>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">删除</button>
                `;
                list.appendChild(li);
            });
        }

        // 按回车键也可以添加
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
